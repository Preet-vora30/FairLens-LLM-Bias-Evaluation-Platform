services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fairlens-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/fairlens.db
      - MODEL_CACHE_DIR=/app/cache/models
      - DATASET_CACHE_DIR=/app/cache/datasets
      - REPORTS_DIR=/app/reports
    volumes:
      - fairlens_data:/app/data
      - fairlens_models:/app/cache/models
      - fairlens_datasets:/app/cache/datasets
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fairlens-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

volumes:
  fairlens_data:
  fairlens_models:
  fairlens_datasets:
